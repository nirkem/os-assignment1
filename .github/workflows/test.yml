name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the RISC-V toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu qemu-system-misc
      - name: Build
        run: make
      - name: Run syscalltests and usertests in QEMU
        run: bash .github/run-tests.sh
